# Packaging. Windows first; the installer that wraps this is Inno Setup's.
#
# Two of electron-builder's defaults collide with directories this repository
# already uses, and both collisions are silent:
#
#   buildResources defaults to `build/`  — which here holds PyInstaller's
#                                          intermediate output (build/inwire_agent/)
#   output         defaults to `dist/`   — which here is Vite's renderer build
#
# So both are set explicitly. Getting either wrong means electron-builder
# quietly picks up or overwrites the wrong tree.
appId: com.inwire.app
productName: Inwire

directories:
  buildResources: electron/resources
  output: release

# Only what the app actually loads.
#
# The `!node_modules` line is the one that matters, and it is not what an
# include list looks like it should need. electron-builder packs every
# production dependency **regardless** of the patterns above it: `files` filters
# the app's own tree, and node_modules is handled separately. Measured before
# the exclusion: app.asar was **273 MB** and the unpacked app 667 MB, for a
# renderer that is 9.7 MB.
#
# Nothing in there is reachable at runtime. Vite bundles every renderer
# dependency into dist/assets, and `electron/build.cjs` bundles main, the
# preload and the store entry with `electron` as the ONLY external - so the
# packaged app resolves no module from disk at all. If that ever stops being
# true, this line is what will make it fail loudly at start rather than
# silently ship 250 MB nobody loads.
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!node_modules/**/*'

# `dir` only, for now. The real installer is Inno Setup wrapping this output,
# and it is `installer/setup.iss` - the unified one that carries both the app
# and the agent. `local-agent/installer/setup.iss` is the legacy agent-only
# installer (ADR 0032 calls it that) and is no longer what ships.
#
# Npcap is **not** installed by either of them any more: ADR 0032 moved it to
# the Update Center, because the silent install needs an OEM licence. What the
# Inno script still carries is the service registration with its
# failure-recovery policy, the exe-unlock sequence for a service that can starve
# under load and miss an SCM stop, and the legacy-name cleanup. Re-deriving that
# in NSIS is the highest-risk rewrite available in this migration for no
# user-visible gain.
#
# The cost, accepted deliberately: electron-updater cannot drive an Inno
# installer, so updates are hand-rolled.
# Drops the Chromium locale packs - 49 MB of 378, none of which this app can
# display. `electronLanguages` is the documented option and is macOS-only; see
# the header of the hook for why this is a hook.
afterPack: electron/afterPack.cjs

win:
  # The app executable's icon. Before this the key was absent, and
  # `directories.buildResources` above points at a folder that did not exist - so
  # `Inwire.exe` shipped with **Electron's default icon**, which nothing in the
  # suite could see because there was nothing to compare it against.
  #
  # Named explicitly rather than left to electron-builder's default lookup. Two
  # of this file's defaults already collided silently with directories this repo
  # uses; a third is not worth the four characters it saves.
  #
  # Written by `scripts/brand/render-icons.ts` from the same buffer as
  # `local-agent/icon.ico`, and `scripts/brand/icon.ts` asserts the two are
  # byte-identical.
  icon: electron/resources/icon.ico
  target:
    - dir
