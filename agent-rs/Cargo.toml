[package]
name = "inwire-agent"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
publish = false

# The version is deliberately 0.0.0 and is NOT the product version.
#
# `local-agent/agent.py` carries AGENT_VERSION, `installer/setup.iss` carries
# MyAgentVersion and MyAppVersion, and there are six stamps in total that a
# later step collapses into one sourced from package.json. Adding a seventh
# here, now, would be adding a stamp to the pile the collapse exists to remove.
# The build stamps the real version in when that step lands.

[lib]
name = "inwire_agent"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# Reading the golden vectors the Python and TypeScript sides are also held to.
serde_json = "1"

[profile.release]
# A capture agent is a long-lived service; size and predictability beat the
# last few percent of speed, and a smaller binary is a smaller thing to sign.
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
