[package]
name = "inwire-agent"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
publish = false

# The version is deliberately 0.0.0 and is NOT the product version.
#
# `local-agent/agent.py` carries AGENT_VERSION, `installer/setup.iss` carries
# MyAgentVersion and MyAppVersion, and there are six stamps in total that a
# later step collapses into one sourced from package.json. Adding a seventh
# here, now, would be adding a stamp to the pile the collapse exists to remove.
# The build stamps the real version in when that step lands.

[lib]
name = "inwire_agent"
path = "src/lib.rs"

[dependencies]
# **The one dependency, and CLAUDE.md's rule asks what it buys over the platform.**
#
# The answer is a JSON parser that reads input arriving over a pipe into a
# privileged service. Hand-rolling that is the trade this rule exists to refuse:
# it would be the only unaudited parser in the process that parses anything, and
# the thing it parses comes from outside.
#
# `default-features = false` with `std`, and **no derive**: the protocol is about
# fifteen fixed shapes, so `json!` and `Value` carry it without proc macros,
# which keeps the build and the supply chain smaller than the usual serde pull.
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
# A capture agent is a long-lived service; size and predictability beat the
# last few percent of speed, and a smaller binary is a smaller thing to sign.
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
