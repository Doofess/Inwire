<rect x="960" y="330" width="180" height="150" rx="8" fill="#e6f6ec" stroke="#2f855a" stroke-width="1.5"/><path d="M968,330 h164 a8,8 0 0 1 8,8 v16 h-180 v-16 a8,8 0 0 1 8,-8 z" fill="#2f855a"/><text x="970" y="346.5" class="ct" fill="#fff">Capture store</text><text x="1130" y="346.5" class="tag" text-anchor="end" fill="#fff">utilityProcess</text><text x="970" y="377" class="m" fill="#1b4a34">electron/store/entry.ts</text><text x="970" y="392" class="b" fill="#1b4a34">Forked by main, brokered</text><text x="970" y="407" class="b" fill="#1b4a34">over a MessageChannel</text><text x="970" y="422" class="b" fill="#1b4a34">Writes and reads the four</text><text x="970" y="437" class="b" fill="#1b4a34">capture files</text><text x="970" y="452" class="b" fill="#1b4a34">Runs the whole-capture</text><text x="970" y="467" class="b" fill="#1b4a34">filter scan</text>
