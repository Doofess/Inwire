<rect x="20" y="60" width="170" height="130" rx="8" fill="#e9ecf2" stroke="#475569" stroke-width="1.5"/><path d="M28,60 h154 a8,8 0 0 1 8,8 v16 h-170 v-16 a8,8 0 0 1 8,-8 z" fill="#475569"/><text x="30" y="76.5" class="ct" fill="#fff">Network adapter</text><text x="180" y="76.5" class="tag" text-anchor="end" fill="#fff">kernel</text><text x="30" y="107" class="b" fill="#1e293b">Npcap driver, 32 MB</text><text x="30" y="122" class="b" fill="#1e293b">kernel ring buffer</text><text x="30" y="137" class="b" fill="#1e293b">Devices restricted to</text><text x="30" y="152" class="b" fill="#1e293b">Administrators</text><text x="30" y="167" class="b" fill="#1e293b">(recommended; the agent</text><text x="30" y="182" class="b" fill="#1e293b">makes it free)</text>
<rect x="300" y="50" width="200" height="150" rx="8" fill="#fff4e0" stroke="#b9770e" stroke-width="1.5"/><path d="M308,50 h184 a8,8 0 0 1 8,8 v16 h-200 v-16 a8,8 0 0 1 8,-8 z" fill="#b9770e"/><text x="310" y="66.5" class="ct" fill="#fff">inwire-agent</text><text x="490" y="66.5" class="tag" text-anchor="end" fill="#fff">LocalSystem</text><text x="310" y="97" class="m" fill="#5a3a00">local-agent/agent.py</text><text x="310" y="112" class="b" fill="#5a3a00">Holds the capture handle</text><text x="310" y="127" class="b" fill="#5a3a00">Pipe: \\.\pipe\inwire-agent</text><text x="310" y="142" class="b" fill="#5a3a00">Sniffs nothing until asked,</text><text x="310" y="157" class="b" fill="#5a3a00">stops when the last client</text><text x="310" y="172" class="b" fill="#5a3a00">leaves</text><text x="310" y="187" class="b" fill="#5a3a00">Dissects nothing (ADR 0010)</text>
<rect x="610" y="50" width="200" height="150" rx="8" fill="#e6f0fb" stroke="#2b6cb0" stroke-width="1.5"/><path d="M618,50 h184 a8,8 0 0 1 8,8 v16 h-200 v-16 a8,8 0 0 1 8,-8 z" fill="#2b6cb0"/><text x="620" y="66.5" class="ct" fill="#fff">Inwire.exe main</text><text x="800" y="66.5" class="tag" text-anchor="end" fill="#fff">Node</text><text x="620" y="97" class="m" fill="#183a5e">electron/main.ts</text><text x="620" y="112" class="b" fill="#183a5e">app://inwire handler, window,</text><text x="620" y="127" class="b" fill="#183a5e">menu, quit guard, native</text><text x="620" y="142" class="b" fill="#183a5e">dialogs</text><text x="620" y="157" class="b" fill="#183a5e">Pipe client: deframes, never</text><text x="620" y="172" class="b" fill="#183a5e">parses a frame</text>
<rect x="900" y="50" width="240" height="150" rx="8" fill="#f0e9fb" stroke="#6b46c1" stroke-width="1.5"/><path d="M908,50 h224 a8,8 0 0 1 8,8 v16 h-240 v-16 a8,8 0 0 1 8,-8 z" fill="#6b46c1"/><text x="910" y="66.5" class="ct" fill="#fff">Renderer</text><text x="1130" y="66.5" class="tag" text-anchor="end" fill="#fff">sandbox</text><text x="910" y="97" class="m" fill="#382266">src/App.tsx + components/</text><text x="910" y="112" class="b" fill="#382266">React 19 · sandbox: true · no Node</text><text x="910" y="127" class="b" fill="#382266">Sees rows, never a raw frame</text><text x="910" y="142" class="b" fill="#382266">Ferries two MessagePorts once, then</text><text x="910" y="157" class="b" fill="#382266">plays no part in the frame path</text>
