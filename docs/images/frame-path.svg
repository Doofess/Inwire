    svg text { font-family: "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
    svg .ct { font-size: 12.5px; font-weight: 650; }
    svg .gt { font-size: 13px;   font-weight: 650; }
    svg .h  { font-size: 11.5px; font-weight: 650; }
    svg .b  { font-size: 11.5px; }
    svg .al { font-size: 10.5px; font-weight: 500; }
    svg .s  { font-size: 10.5px; }
    svg .num{ font-size: 12px;   font-weight: 700; }
    svg .tag{ font-size: 9.5px;  font-weight: 500; letter-spacing: .03em; opacity: .92; }
    svg .m  { font-family: "Cascadia Mono","Consolas",ui-monospace,monospace; font-size: 10.5px; }
    svg .m.s{ font-size: 9.6px; }
  </style>
  <rect width="1160" height="640" fill="#ffffff"/>
