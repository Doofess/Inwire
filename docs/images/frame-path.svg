<rect x="734" y="320" width="168" height="175" rx="8" fill="#f0e9fb" stroke="#6b46c1" stroke-width="1.5"/><path d="M742,320 h152 a8,8 0 0 1 8,8 v16 h-168 v-16 a8,8 0 0 1 8,-8 z" fill="#6b46c1"/><text x="744" y="336.5" class="ct" fill="#fff">Flush · 100 ms</text><text x="744" y="367" class="m" fill="#382266">usePacketBuffer.ts</text><text x="744" y="382" class="m" fill="#382266">packetBuffer.ts</text><text x="744" y="397" class="b" fill="#382266">prepareBatch runs</text><text x="744" y="412" class="b" fill="#382266">exactly once;</text><text x="744" y="427" class="b" fill="#382266">commitBatch survives</text><text x="744" y="442" class="b" fill="#382266">React running it twice</text>
