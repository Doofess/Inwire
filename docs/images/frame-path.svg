<svg viewBox="0 0 1160 640" role="img" aria-label="Read the top row left to right and the bottom row right to left. The first three hops are the agent; from the pipe onward the bytes are copied exactly once (MessagePortMain clones an ArrayBuffer, it cannot transfer one) and are parsed only inside the Worker. The Worker emits summaries, not trees, on a 100 ms timer. The renderer persists each batch to the store before it absorbs it into React state, so the disk copy is complete even if the RAM window later trims." xmlns="http://www.w3.org/2000/svg">
