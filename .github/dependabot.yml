version: 2

updates:
  # This is the one that would have caught `actions/checkout@v7` - three actions
  # pinned to major versions that do not exist, failing every run since the
  # workflow was written. Nothing else here has an opinion about a workflow file:
  # `scripts/check.ts` only discovers TypeScript, and an action reference is not
  # a path, so `claude-md-refs.ts` never resolves it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the patch noise rather than fifteen. Majors stay separate,
      # because for this tree they are rarely mechanical - Electron in
      # particular gets security fixes for three majors, so a bump is a decision
      # about which three, not a version number.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deliberately manual. Electron's major line is chosen against its support
      # window, and electron-builder follows whatever Electron is pinned to.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: electron-builder
        update-types: [version-update:semver-major]
      # The types describe the oldest Node the code runs on, not the newest one
      # published: engines is >=24, CI runs 24, and Electron 44 embeds 24. A
      # newer major types APIs that runtime does not have. Moved by hand with
      # the engines floor and Electron's Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # 1.0 is an ESM + WASM rewrite meant to be bundled into Mapbox GL JS and
      # "no longer works as a setRTLTextPlugin plugin" (its release notes); its
      # UMD file, which vite.config.ts copies to assets/ for maplibre's
      # setRTLTextPlugin, is gone. 0.4 is the last loadable build. Revisit if
      # maplibre takes the 1.x API.
      - dependency-name: "@mapbox/mapbox-gl-rtl-text"
        update-types: [version-update:semver-major]
