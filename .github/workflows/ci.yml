name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # NOT "Web app". The job name is what shows in the checks tab, which is one
    # of the few places a visitor reads, and this stopped being a web app when
    # the browser build was deleted - the README says so in as many words.
    name: App (type-check, assertions, build, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform this app actually ships on - named pipes,
        # Npcap, an Inno installer - and it was the one platform CI never ran.
        # The suite is safe here: the scripts that need a real capture device,
        # the installed service or a packaged build are in `check.ts`'s
        # NOT_TESTS, and the rest self-skip when `dist/` or playwright is
        # missing.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit plus every assertion script under scripts/. These cover the
      # theme contract (token completeness, contrast floors, CSS-vs-palette
      # drift), the protocol dissectors, the filter grammar and the agent
      # protocol version triple. This is the gate that matters.
      #
      # Deliberately BEFORE the build: every `dist/`-dependent script then
      # reports SKIP rather than failing, which is the honest answer when there
      # is nothing to launch.
      - name: Type-check and run assertion scripts
        run: npm run check

      - name: Build
        run: npm run build

  agent-rs:
    # The agent the Windows installer ships (ADR 0037). Windows only, because
    # that is all it is: the macOS and Linux agent is the Python one, below.
    #
    # Ends with the SHIPPABLE file, not cargo's output: `npm run build:agent`
    # builds and then stamps VERSIONINFO, the app's icon and an asInvoker
    # manifest onto a copy in agent-rs/dist, and `built-version.ts` reads that
    # copy back through Windows' own version reader. A release build that
    # compiles but would install as a resource-less exe, or as one reporting a
    # version the app refuses, fails here rather than in someone's installer.
    #
    # The script's last step, signing, runs too and does nothing here: the
    # runner has no certificate, so scripts/sign/sign.ps1 warns and leaves the
    # file unsigned - which is the behaviour for any machine without one, and
    # why INWIRE_REQUIRE_SIGNING is deliberately NOT set on this job.
    name: Rust capture agent (tests, release build, resources)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # For tsx and `resedit`, which stamp and check the resources. Electron's
      # own ~100 MB binary is skipped: nothing in this job launches it.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # By name, because `agent-rs/rust-toolchain.toml` cannot carry a host:
      # rustup refuses a target tuple in the channel wherever that toolchain is
      # not already installed - which on a fresh runner is always. The runner's
      # default is MSVC, and every number ADR 0037 quotes was measured on GNU.
      - name: Install the GNU toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Test
        working-directory: agent-rs
        run: cargo +stable-x86_64-pc-windows-gnu test --locked

      - name: Build the release exe and stamp its resources
        run: npm run build:agent

      - name: Check the built agent's version and resources
        run: npx tsx scripts/agent/built-version.ts

  agent:
    # On macOS as well as Linux since 3.3.0, because the Unix installer is no
    # longer a shell script with a stale copy of the agent inside it - it
    # installs the real modules, and "the real modules import cleanly on that
    # OS" is now something worth knowing before somebody downloads them.
    name: Capture agent (protocol tests, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Not requirements.txt: that pulls pyinstaller (packaging only) and
      # pywin32 (Windows only). These three are what importing the agent
      # module needs.
      - name: Install runtime dependencies
        run: python -m pip install --quiet scapy websockets psutil

      - name: Run protocol tests
        working-directory: local-agent
        run: python test_protocol.py

      # Was in nobody's run list; a test that only runs when someone
      # remembers it exists is not coverage.
      - name: Run interface-stats tests
        working-directory: local-agent
        run: python test_interface_stats.py

      # The installer is the thing a macOS or Linux user actually runs, and it
      # is a shell script, so it gets the one check a shell script can be given
      # without root: that it parses.
      - name: Check the Unix installer parses
        run: sh -n local-agent/unix/install.sh

      - name: Check the agent imports on this OS
        working-directory: local-agent
        run: python -c "import agent; print(agent.AGENT_VERSION)"
